<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fun Arcade</title>
<style>
* { box-sizing: border-box; }
body { 
    margin: 0; padding: 0;
    background: radial-gradient(circle at 10% 12%, rgba(255,255,255,0.03), transparent 12%),
                linear-gradient(135deg, #1a1a2e 0%, #16213e 60%, #071028 100%),
                repeating-linear-gradient(180deg, rgba(255,255,255,0.02) 0 1px, transparent 1px 48px);
    background-blend-mode: overlay, normal;
    font-family: 'Arial', sans-serif; color: white; min-height: 100vh;
    overflow-x: hidden;
}
#dotsCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
h1 { font-size: 5rem; margin: 40px 0; text-align: center; background: linear-gradient(45deg, #00d4ff, #ff006e); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 0 30px rgba(0, 212, 255, 0.3); letter-spacing: 2px; animation: pulse 2s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.8; } }
h2 { font-size: 2.5rem; margin: 40px 0 20px; text-align: center; color: #00d4ff; text-shadow: 0 0 20px rgba(0, 212, 255, 0.2); }
.game-container { width: 90%; max-width: 1200px; margin: 20px auto; padding: 40px; background: rgba(20,20,40,0.85); border-radius: 15px; border: 2px solid #00d4ff; box-shadow: 0 0 50px rgba(0, 212, 255, 0.3); }
.games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin: 30px 0; }
.game-button { padding: 30px 15px; font-size: 1.2rem; font-weight: bold; background: linear-gradient(135deg, #667eea, #764ba2); border: 2px solid #00d4ff; border-radius: 12px; color: white; cursor: pointer; text-transform: uppercase; transition: all 0.3s ease; box-shadow: 0 5px 25px rgba(102, 126, 234, 0.4); }
.game-button:hover { transform: translateY(-5px); box-shadow: 0 10px 40px rgba(0, 212, 255, 0.6); }
.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(10px); }
.modal.show { display: flex; }
.modal-content { width: 90%; max-width: 800px; height: 85vh; background: #0f3460; border: 3px solid #00d4ff; border-radius: 20px; padding: 30px; position: relative; display: flex; flex-direction: column; align-items: center; }
.close-btn { position: absolute; top: 15px; right: 15px; width: 40px; height: 40px; background: #ff006e; border: none; border-radius: 50%; color: white; cursor: pointer; font-weight: bold; }
.score-display { font-size: 2rem; color: #00d4ff; margin-bottom: 15px; text-shadow: 0 0 10px #00d4ff; }
#gameArea { width: 100%; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
canvas.game-canvas { background: #000; border: 2px solid #00d4ff; max-width: 100%; max-height: 60vh; image-rendering: pixelated; }
</style>
</head>
<body>

<canvas id="dotsCanvas"></canvas>
<h1>🎮 FUN ARCADE 🎮</h1>

<div class="game-container">
    <h2>⚡ Mini-Games</h2>
    <div class="games-grid">
        <button class="game-button" onclick="GameManager.open('reaction')">Reaction Time</button>
        <button class="game-button" onclick="GameManager.open('memory')">Memory Match</button>
        <button class="game-button" onclick="GameManager.open('clicker')">Candy Clicker</button>
        <button class="game-button" onclick="GameManager.open('ballbounce')">Ping Pong</button>
        <button class="game-button" onclick="GameManager.open('snake')">Snake</button>
        <button class="game-button" onclick="GameManager.open('simon')">Simon</button>
        <button class="game-button" onclick="GameManager.open('mathquiz')">Math Quiz</button>
        <button class="game-button" onclick="GameManager.open('breakout')">Breakout</button>
        <button class="game-button" onclick="GameManager.open('flappy')">Flappy Bird</button>
        <button class="game-button" onclick="GameManager.open('whack')">Whack-a-Mole</button>
        <button class="game-button" onclick="GameManager.open('dino')">Dino Run</button>
    </div>
    <h2>🎯 Embedded Games</h2>
    <div class="games-grid">
        <button class="game-button" onclick="GameManager.open('motox3m')">Moto X3M</button>
        <button class="game-button" onclick="GameManager.open('bouncemasters')">Bounce Masters</button>
        <button class="game-button" onclick="GameManager.open('gnmath')">GN Math</button>
    </div>
</div>

<div id="gameModal" class="modal">
    <div class="modal-content">
        <button class="close-btn" onclick="GameManager.close()">✕</button>
        <div id="scoreDisplay" class="score-display">Score: 0</div>
        <div id="gameArea"></div>
    </div>
</div>

<script>
class DotBackground {
    constructor() {
        this.canvas = document.getElementById('dotsCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.dots = [];
        this.init();
    }
    init() {
        this.resize();
        window.addEventListener('resize', () => this.resize());
        for (let i = 0; i < 80; i++) {
            this.dots.push({
                x: Math.random() * innerWidth,
                y: Math.random() * innerHeight,
                vx: (Math.random() - 0.5) * 0.5,
                vy: (Math.random() - 0.5) * 0.5,
                r: Math.random() * 2 + 1
            });
        }
        this.animate();
    }
    resize() { this.canvas.width = window.innerWidth; this.canvas.height = window.innerHeight; }
    animate() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        this.ctx.fillStyle = '#00d4ff';
        this.dots.forEach(d => {
            d.x += d.vx; d.y += d.vy;
            if (d.x < 0 || d.x > this.canvas.width) d.vx *= -1;
            if (d.y < 0 || d.y > this.canvas.height) d.vy *= -1;
            this.ctx.beginPath(); this.ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); this.ctx.fill();
        });
        requestAnimationFrame(() => this.animate());
    }
}

const GameManager = {
    gameArea: document.getElementById('gameArea'),
    scoreDisplay: document.getElementById('scoreDisplay'),
    modal: document.getElementById('gameModal'),
    score: 0,
    activeLoop: null,
    trollActive: false,
    trollCounter: 0,

    open(game) {
        this.score = 0; this.updateScore(); this.gameArea.innerHTML = ''; this.modal.classList.add('show');
        if(this.activeLoop) { cancelAnimationFrame(this.activeLoop); clearTimeout(this.activeLoop); }
        
        window.onkeydown = (e) => {
            if (e.key.toLowerCase() === 'l') {
                this.trollCounter++;
                if (this.trollCounter >= 3) {
                    this.trollActive = !this.trollActive;
                    this.trollCounter = 0;
                }
            }
        };
        if(this[game]) this[game]();
    },
    close() { this.modal.classList.remove('show'); this.gameArea.innerHTML = ''; if(this.activeLoop) cancelAnimationFrame(this.activeLoop); window.onkeydown = null; },
    updateScore(v) { if(v!==undefined) this.score=v; this.scoreDisplay.innerText = `Score: ${this.score}`; },

    ballbounce() {
        const c = document.createElement('canvas'); c.className = 'game-canvas'; c.width = 600; c.height = 400;
        this.gameArea.appendChild(c);
        const ctx = c.getContext('2d');
        let ball = { x: 300, y: 200, dx: 4, dy: 4, r: 8, isFrozen: false };
        let player = { y: 150, h: 80, w: 10 };
        let ai = { y: 150, h: 80, w: 10, speed: 3.8 };

        c.onmousemove = (e) => {
            const rect = c.getBoundingClientRect();
            player.y = (e.clientY - rect.top) * (c.height / rect.height) - player.h / 2;
        };

        const loop = () => {
            if (!ball.isFrozen) {
                ball.x += ball.dx; ball.y += ball.dy;
            }

            if (ball.y <= 0 || ball.y >= c.height) ball.dy *= -1;

            let aiCenter = ai.y + ai.h / 2;
            if (aiCenter < ball.y - 10) ai.y += ai.speed;
            else if (aiCenter > ball.y + 10) ai.y -= ai.speed;

            // Player Collision
            if (!ball.isFrozen && ball.x <= player.w + 15 && ball.y > player.y && ball.y < player.y + player.h) {
                if (this.trollActive) {
                    ball.isFrozen = true;
                    // Freeze for 2 seconds
                    setTimeout(() => {
                        ball.isFrozen = false;
                        ball.dx = -Math.abs(ball.dx); // Bounce backwards
                        ball.dy = Math.random() > 0.5 ? -7 : 7; // Betrayal angle
                    }, 2000);
                } else {
                    ball.dx = Math.abs(ball.dx) + 0.2;
                    this.updateScore(this.score + 1);
                }
            } else if (ball.x < 0) return this.open('ballbounce');

            if (ball.x >= c.width - ai.w - 15 && ball.y > ai.y && ball.y < ai.y + ai.h) {
                ball.dx = -Math.abs(ball.dx) - 0.2;
            } else if (ball.x > c.width) {
                this.updateScore(this.score + 5);
                ball = { x: 300, y: 200, dx: 4, dy: 4, r: 8, isFrozen: false };
            }

            ctx.fillStyle = "#000"; ctx.fillRect(0, 0, c.width, c.height);
            ctx.fillStyle = "#00d4ff"; ctx.fillRect(10, player.y, player.w, player.h);
            ctx.fillStyle = "#ff006e"; ctx.fillRect(c.width - 20, ai.y, ai.w, ai.h);
            ctx.fillStyle = ball.isFrozen ? "#ff006e" : "#fff"; // Turn red when frozen
            ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();
            this.activeLoop = requestAnimationFrame(loop);
        }; loop();
    },

    whack() {
        this.gameArea.innerHTML = `<div style="display:grid;grid-template-columns:repeat(3,100px);gap:15px;" id="h"></div>`;
        const container = document.getElementById('h');
        for(let i=0;i<9;i++) {
            const hole = document.createElement('div');
            hole.style.cssText = "width:100px;height:100px;background:#16213e;border:2px solid #00d4ff;font-size:3rem;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;border-radius:10px;";
            container.appendChild(hole);
        }
        const holes = container.querySelectorAll('div');
        
        container.onmousemove = (e) => {
            if (!this.trollActive) return;
            holes.forEach(h => {
                if (h.innerText === '🦫') {
                    const rect = h.getBoundingClientRect();
                    const dist = Math.hypot(e.clientX - (rect.left + 50), e.clientY - (rect.top + 50));
                    if (dist < 65) h.innerText = ''; 
                }
            });
        };

        const pop = () => {
            holes.forEach(h => { h.innerText = ''; h.onclick = null; });
            const r = holes[Math.floor(Math.random() * 9)];
            r.innerText = '🦫';
            r.onclick = () => { this.updateScore(this.score + 1); r.innerText = ''; };
            this.activeLoop = setTimeout(pop, 800);
        }; pop();
    },

    snake() {
        const c = document.createElement('canvas'); c.className='game-canvas'; c.width=400; c.height=400; this.gameArea.appendChild(c);
        const ctx = c.getContext('2d');
        let s=[{x:10,y:10}], f={x:5,y:5}, dx=0, dy=0;
        const oldKey = window.onkeydown;
        window.onkeydown=(e)=>{ 
            if(oldKey) oldKey(e);
            if(e.key=='ArrowUp'&&dy==0){dx=0;dy=-1} if(e.key=='ArrowDown'&&dy==0){dx=0;dy=1} 
            if(e.key=='ArrowLeft'&&dx==0){dx=-1;dy=0} if(e.key=='ArrowRight'&&dx==0){dx=1;dy=0}
        };
        const loop = () => {
            let h={x:s[0].x+dx, y:s[0].y+dy};
            if(h.x<0||h.x>=20||h.y<0||h.y>=20||s.some(p=>p.x==h.x&&p.y==h.y)) return this.open('snake');
            s.unshift(h); if(h.x==f.x&&h.y==f.y){this.updateScore(this.score+10); f={x:Math.floor(Math.random()*20),y:Math.floor(Math.random()*20)}} else s.pop();
            ctx.fillStyle="#000"; ctx.fillRect(0,0,400,400);
            ctx.fillStyle="#ff006e"; ctx.fillRect(f.x*20,f.y*20,18,18);
            ctx.fillStyle="#00d4ff"; s.forEach(p=>ctx.fillRect(p.x*20,p.y*20,18,18));
            let speed = this.trollActive ? 45 : 90;
            this.activeLoop = setTimeout(()=>requestAnimationFrame(loop), speed);
        }; loop();
    },

    clicker() {
        let clicks = 0, timeLeft = 30;
        const b = document.createElement('button'); b.style.cssText="width:150px;height:150px;border-radius:50%;font-size:4rem;cursor:pointer;background:radial-gradient(circle, #ff006e, #764ba2);border:none;box-shadow: 0 0 20px #ff006e;transition:all 0.1s;";
        b.innerHTML='🍬'; 
        const timer = document.createElement('div'); timer.style.cssText="font-size:1.5rem;color:#00d4ff;margin-top:20px;";
        const container = document.createElement('div'); container.style.cssText="display:flex;flex-direction:column;align-items:center;";
        container.appendChild(b); container.appendChild(timer);
        this.gameArea.appendChild(container);
        
        b.onclick = () => { clicks++; b.style.transform='scale(0.95)'; setTimeout(()=>b.style.transform='scale(1)',50); };
        const interval = setInterval(() => {
            timeLeft--;
            timer.innerText = `Time: ${timeLeft}s`;
            if(timeLeft <= 0) { clearInterval(interval); this.updateScore(clicks); this.gameArea.innerHTML='<div style="font-size:2rem;color:#00d4ff;">Final Score: '+clicks+' clicks!</div>'; }
        }, 1000);
    },
    reaction() {
        this.gameArea.innerHTML = `<div id="rb" style="width:100%;height:200px;background:#ff006e;display:flex;align-items:center;justify-content:center;font-size:2rem;cursor:pointer;border-radius:15px;">Wait for Green...</div>`;
        const rb = document.getElementById('rb');
        setTimeout(() => {
            rb.style.background = "#00ff88"; rb.innerText = "CLICK!";
            const start = Date.now();
            rb.onclick = () => { this.updateScore(Date.now()-start); rb.innerText = this.score + "ms! Play Again?"; rb.onclick = () => this.open('reaction'); };
        }, Math.random()*3000+2000);
    },
    flappy() {
        const c = document.createElement('canvas'); c.className='game-canvas'; c.width=320; c.height=480; this.gameArea.appendChild(c);
        const ctx = c.getContext('2d');
        let by=200, bv=0, pipes=[], frame=0;
        window.onmousedown = () => bv = -6;
        const loop = () => {
            bv += 0.4; by += bv;
            if(frame%90==0) pipes.push({x:320, h:Math.random()*200+50});
            ctx.fillStyle="#000"; ctx.fillRect(0,0,320,480);
            ctx.fillStyle="#00d4ff"; ctx.fillRect(50,by,20,20);
            pipes.forEach(p=>{ p.x-=2; ctx.fillStyle="#00ff88"; ctx.fillRect(p.x,0,40,p.h); ctx.fillRect(p.x,p.h+120,40,480); if(p.x==50) this.updateScore(this.score+1); if(p.x<70 && p.x+40>50 && (by<p.h || by+20>p.h+120)) by=999; });
            if(by>480) return this.open('flappy');
            frame++; this.activeLoop = requestAnimationFrame(loop);
        }; loop();
    },
    mathquiz() {
        const a=Math.floor(Math.random()*20), b=Math.floor(Math.random()*20);
        this.gameArea.innerHTML = `<h3>${a} + ${b}?</h3><input type="number" id="ans" style="padding:10px;border-radius:5px;"><button onclick="GameManager.checkMath(${a+b})" style="padding:10px;margin-left:10px;">Go</button>`;
    },
    checkMath(correct) { if(document.getElementById('ans').value == correct) { this.updateScore(this.score+1); this.mathquiz(); } else this.open('mathquiz'); },
    memory() {
        const icons = ['🍎','🍎','🍌','🍌','🍇','🍇','🍒','🍒'].sort(()=>Math.random()-0.5);
        this.gameArea.innerHTML = `<div style="display:grid;grid-template-columns:repeat(4,70px);gap:10px;">${icons.map(i=>`<div class="t" data-i="${i}" style="width:70px;height:70px;background:#16213e;border:2px solid #00d4ff;display:flex;align-items:center;justify-content:center;font-size:2rem;cursor:pointer;" onclick="GameManager.tile(this)">?</div>`).join('')}</div>`;
    },
    tile(t) {
        if(t.innerText!=='?' || this.busy) return;
        t.innerText = t.dataset.i;
        const open = Array.from(document.querySelectorAll('.t')).filter(x=>x.innerText!=='?' && !x.matched);
        if(open.length==2) {
            this.busy = true;
            if(open[0].dataset.i == open[1].dataset.i) { open.forEach(x=>x.matched=true); this.updateScore(this.score+10); this.busy=false; }
            else setTimeout(()=>{ open.forEach(x=>x.innerText='?'); this.busy=false; }, 500);
        }
    },
    simon() {
        this.gameArea.innerHTML = `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">${[0,1,2,3].map(i=>`<div id="s${i}" onclick="GameManager.sPress(${i})" style="width:100px;height:100px;background:${['#ff006e','#00d4ff','#00ff88','#ffbe0b'][i]};opacity:0.5;cursor:pointer;"></div>`).join('')}</div>`;
        this.seq = []; this.sNext();
    },
    sNext() {
        this.seq.push(Math.floor(Math.random()*4)); this.uSeq = [];
        this.seq.forEach((c,i)=>setTimeout(()=>{ let el=document.getElementById('s'+c); if(el){el.style.opacity=1; setTimeout(()=>el.style.opacity=0.5,300);} }, i*600));
    },
    sPress(i) {
        this.uSeq.push(i);
        if(this.uSeq[this.uSeq.length-1] !== this.seq[this.uSeq.length-1]) return this.open('simon');
        if(this.uSeq.length == this.seq.length) { this.updateScore(this.score+1); setTimeout(()=>this.sNext(), 1000); }
    },
    dino() {
        const c = document.createElement('canvas'); c.className='game-canvas'; c.width=600; c.height=150; this.gameArea.appendChild(c);
        const ctx = c.getContext('2d');
        let dy=100, dv=0, ox=600;
        window.onkeydown = () => { if(dy==100) dv=-10; };
        const loop = () => {
            dv+=0.6; dy+=dv; if(dy>100){dy=100;dv=0;} ox-=5; if(ox<-20){ox=600;this.updateScore(this.score+1);}
            ctx.fillStyle="#000"; ctx.fillRect(0,0,600,150); ctx.fillStyle="#00d4ff"; ctx.fillRect(50,dy,30,30);
            ctx.fillStyle="#ff006e"; ctx.fillRect(ox,100,20,30);
            if(ox<80 && ox>50 && dy>70) return this.open('dino');
            this.activeLoop = requestAnimationFrame(loop);
        }; loop();
    },
    breakout() {
        const c = document.createElement('canvas'); c.className='game-canvas'; c.width=400; c.height=400; this.gameArea.appendChild(c);
        const ctx = c.getContext('2d');
        let x=200, y=350, dx=2, dy=-2, px=150, bks=[];
        for(let r=0;r<3;r++) for(let col=0;col<5;col++) bks.push({x:col*80,y:r*30,v:1});
        c.onmousemove=(e)=>{ px = e.offsetX - 40; };
        const loop = () => {
            x+=dx; y+=dy; if(x<0||x>400)dx*=-1; if(y<0)dy*=-1;
            if(y>380 && x>px && x<px+80)dy*=-1;
            bks.forEach(b=>{ if(b.v && x>b.x && x<b.x+75 && y>b.y && y<b.y+25){b.v=0; dy*=-1; this.updateScore(this.score+10);}});
            if(y>400) return this.open('breakout');
            ctx.fillStyle="#000"; ctx.fillRect(0,0,400,400); ctx.fillStyle="#ff006e"; bks.forEach(b=>{if(b.v)ctx.fillRect(b.x+2,b.y+2,75,25)});
            ctx.fillStyle="#00d4ff"; ctx.fillRect(px,385,80,10); ctx.beginPath();ctx.arc(x,y,6,0,7);ctx.fill();
            this.activeLoop = requestAnimationFrame(loop);
        }; loop();
    },
    motox3m(){ this.embed('https://playgama.com/game/moto-x3m'); },
    bouncemasters(){ this.embed('https://www.crazygames.com/embed/bounce-masters'); },
    gnmath(){ this.embed('https://doyourhomework.dream.org.il/'); },
    embed(u){ const ifr=document.createElement('iframe'); ifr.src=u; ifr.style.cssText="width:100%; height:100%; border:none;"; this.gameArea.appendChild(ifr); }
};
document.addEventListener('DOMContentLoaded', () => new DotBackground());
</script>
</body>
</html>
